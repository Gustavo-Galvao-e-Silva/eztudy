[project]
name = "eztudy"
version = "0.6.1"
description = "Local, open-source NotebookLM substitute as an agent skill: wiki + SQLite vector index over a sources/ dir."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.4",
  "sqlite-vec>=0.1.6",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pyyaml>=6",
  "rich>=13",
]

[project.scripts]
eztudy = "eztudy.cli:main"

[project.optional-dependencies]
tui = [
    "textual>=0.80",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eztudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
