<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__EZTUDY_TITLE__</title>
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --border: #e2e0d8;
  --accent: #3554d1; --accent-soft: #e8ecfb; --good: #1f7a4d; --good-soft: #e3f3ea;
  --bad: #b3261e; --bad-soft: #fbe7e5; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #9a998f; --border: #34332f;
    --accent: #8ea2ff; --accent-soft: #262c47; --good: #6fcf97; --good-soft: #1d3329;
    --bad: #ff8a80; --bad-soft: #3a2220; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #9a998f; --border: #34332f;
  --accent: #8ea2ff; --accent-soft: #262c47; --good: #6fcf97; --good-soft: #1d3329;
  --bad: #ff8a80; --bad-soft: #3a2220; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 20px 0 16px; }
.progress { flex: 1; min-width: 120px; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
.q { font-size: 1.15rem; font-weight: 600; margin: 0 0 16px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: inherit; font: inherit; cursor: pointer; display: flex; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.key { color: var(--muted); font-weight: 600; min-width: 1.2em; }
textarea { width: 100%; min-height: 90px; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: inherit; font: inherit; resize: vertical; }
.fb { margin-top: 16px; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
.fb.right { border-color: var(--good); } .fb.wrong { border-color: var(--bad); }
.fb strong.r { color: var(--good); } .fb strong.w { color: var(--bad); }
.cite { margin-top: 8px; font-size: .82rem; color: var(--muted); }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
button.btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.btn.good { border-color: var(--good); color: var(--good); }
button.btn.bad { border-color: var(--bad); color: var(--bad); }
button.btn:disabled { opacity: .45; cursor: default; }
.score { font-size: 2.6rem; font-weight: 700; margin: 0; }
.review li { margin-bottom: 10px; }
.flash { perspective: 1200px; cursor: pointer; min-height: 260px; }
.flash .inner { position: relative; min-height: 260px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; padding: 28px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); }
.face .big { font-size: 1.25rem; font-weight: 600; }
.hint { color: var(--muted); font-size: .85rem; margin-top: 10px; text-align: center; }
select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: inherit; font: inherit; }
@media (prefers-reduced-motion: reduce) { .flash .inner, .progress > i { transition: none; } }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p id="desc"></p></header>
  <div id="app"></div>
</main>
<script>
const DATA = /*__EZTUDY_DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const store = {
  key: "eztudy:" + (DATA.id || DATA.title),
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch {} },
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cites = item => {
  const c = item.citations || [];
  if (!c.length) return null;
  return h("div", { class: "cite" }, "Source: ", c.map(x => typeof x === "string" ? x : [x.source, x.location].filter(Boolean).join(", ") + (x.cid ? ` [${x.cid}]` : "")).join("; "));
};
const tags = item => {
  const t = [item.topic, item.difficulty, ...(item.tags || [])].filter(Boolean);
  return t.length ? h("div", { class: "meta" }, t.map(x => h("span", { class: "tag" }, x))) : null;
};
const LETTERS = "ABCDEFGHIJ";

$("#title").textContent = DATA.title;
$("#desc").textContent = DATA.description || "";

/* ---------------- quiz ---------------- */
function normalizeAnswer(item) {
  if (item.type === "true_false") return [item.answer === true || item.answer === "true" ? 0 : 1];
  if (Array.isArray(item.answer)) return item.answer.slice().sort();
  return [item.answer];
}
function quiz(items) {
  let order = items.map((_, i) => i), pos = 0, results = {};
  const app = $("#app");
  function render() {
    app.innerHTML = "";
    if (pos >= order.length) return summary();
    const item = items[order[pos]];
    const isTF = item.type === "true_false";
    const opts = isTF ? ["True", "False"] : (item.options || []);
    const multi = item.type === "multi";
    const correct = normalizeAnswer(item);
    let chosen = new Set(), done = false;
    const bar = h("div", { class: "bar" }, h("div", { class: "progress" }, h("i", { style: `width:${(pos / order.length) * 100}%` })), h("span", { class: "count" }, `${pos + 1} / ${order.length}`));
    const fb = h("div");
    const card = h("div", { class: "card" }, tags(item), h("p", { class: "q" }, item.question), multi ? h("p", { class: "hint", style: "text-align:left;margin-top:-8px" }, "Select all that apply") : null);
    const next = h("button", { class: "btn primary", disabled: true, onclick: () => { pos++; render(); } }, pos + 1 === order.length ? "Finish" : "Next");
    const record = ok => { results[order[pos]] = ok; next.disabled = false; next.focus(); };
    function grade() {
      done = true;
      const picked = [...chosen].sort();
      const ok = picked.length === correct.length && picked.every((v, i) => v === correct[i]);
      card.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (correct.includes(i)) b.classList.add("right"); else if (chosen.has(i)) b.classList.add("wrong"); });
      fb.replaceWith(feedback(ok, item)); record(ok); check && check.remove();
    }
    let check = null;
    if (item.type === "short") {
      const ta = h("textarea", { placeholder: "Type your answer, then reveal…" });
      const reveal = h("button", { class: "btn primary", onclick: () => {
        reveal.remove(); ta.disabled = true;
        const self = h("div", { class: "actions" },
          h("button", { class: "btn bad", onclick: () => { self.remove(); record(false); } }, "I missed it"),
          h("button", { class: "btn good", onclick: () => { self.remove(); record(true); } }, "I got it"));
        card.append(h("div", { class: "fb" }, h("strong", {}, "Model answer: "), String(item.answer), item.explanation ? h("p", {}, item.explanation) : null, cites(item)), self);
      } }, "Reveal answer");
      card.append(ta, h("div", { class: "actions" }, reveal));
    } else {
      const list = h("div", { class: "opts" }, opts.map((o, i) => h("button", { class: "opt", onclick: e => {
        if (done) return;
        if (multi) { chosen.has(i) ? chosen.delete(i) : chosen.add(i); e.currentTarget.classList.toggle("sel"); check.disabled = !chosen.size; }
        else { chosen = new Set([i]); grade(); }
      } }, h("span", { class: "key" }, LETTERS[i]), h("span", {}, o))));
      card.append(list);
      if (multi) { check = h("button", { class: "btn primary", disabled: true, onclick: grade }, "Check"); card.append(h("div", { class: "actions" }, check)); }
    }
    card.append(fb);
    app.append(bar, card, h("div", { class: "actions" }, next));
    document.onkeydown = e => {
      if (e.target.tagName === "TEXTAREA") return;
      const i = LETTERS.indexOf(e.key.toUpperCase());
      const btns = card.querySelectorAll(".opt");
      if (i >= 0 && i < btns.length && !done) btns[i].click();
      else if (e.key === "Enter" && !next.disabled) next.click();
    };
  }
  function feedback(ok, item) {
    const ans = normalizeAnswer(item).map(i => item.type === "true_false" ? ["True", "False"][i] : item.options[i]).join(", ");
    return h("div", { class: "fb " + (ok ? "right" : "wrong") }, h("strong", { class: ok ? "r" : "w" }, ok ? "Correct. " : "Not quite. "), ok ? "" : `Answer: ${ans}. `, item.explanation || "", cites(item));
  }
  function summary() {
    document.onkeydown = null;
    const total = order.length, right = order.filter(i => results[i]).length;
    const missed = order.filter(i => !results[i]);
    const hist = store.get(); (hist.attempts ||= []).push({ at: new Date().toISOString(), right, total }); store.set(hist);
    const best = Math.max(...hist.attempts.map(a => a.right / a.total));
    app.innerHTML = "";
    app.append(h("div", { class: "card" },
      h("p", { class: "score" }, `${right} / ${total}`),
      h("p", { class: "count" }, `${Math.round(right / total * 100)}% · best ${Math.round(best * 100)}% over ${hist.attempts.length} attempt(s)`),
      missed.length ? [h("h3", {}, "Review"), h("ol", { class: "review" }, missed.map(i => h("li", {}, items[i].question, h("div", { class: "cite" }, items[i].explanation || ""))))] : h("p", {}, "Perfect score."),
      h("div", { class: "actions" },
        missed.length ? h("button", { class: "btn", onclick: () => { order = shuffle(missed); pos = 0; results = {}; render(); } }, "Retry missed") : null,
        h("button", { class: "btn primary", onclick: () => { order = shuffle(items.map((_, i) => i)); pos = 0; results = {}; render(); } }, "Restart (shuffled)"))));
  }
  render();
}

/* ---------------- flashcards ---------------- */
function flashcards(items) {
  const app = $("#app");
  const allTags = [...new Set(items.flatMap(c => c.tags || []))].sort();
  let state = store.get(); state.known ||= {};
  let tag = "", queue = [], flipped = false;
  const ids = items.map((c, i) => c.id || String(i));
  function build(onlyUnknown) {
    queue = shuffle(items.map((_, i) => i).filter(i => (!tag || (items[i].tags || []).includes(tag)) && (!onlyUnknown || !state.known[ids[i]])));
    if (!queue.length && onlyUnknown) queue = shuffle(items.map((_, i) => i).filter(i => !tag || (items[i].tags || []).includes(tag)));
    flipped = false; render();
  }
  function mark(known) {
    const i = queue.shift();
    state.known[ids[i]] = known; store.set(state);
    if (!known) queue.splice(Math.min(queue.length, 3), 0, i); // see it again soon
    flipped = false; render();
  }
  function render() {
    app.innerHTML = "";
    const pool = items.filter(c => !tag || (c.tags || []).includes(tag));
    const knownCount = pool.filter(c => state.known[ids[items.indexOf(c)]]).length;
    const controls = h("div", { class: "bar" },
      h("div", { class: "progress" }, h("i", { style: `width:${pool.length ? knownCount / pool.length * 100 : 0}%` })),
      h("span", { class: "count" }, `${knownCount} / ${pool.length} known`),
      allTags.length ? h("select", { onchange: e => { tag = e.target.value; build(true); } }, h("option", { value: "" }, "All tags"), allTags.map(t => h("option", { value: t, selected: t === tag }, t))) : null);
    app.append(controls);
    if (!queue.length) {
      app.append(h("div", { class: "card" }, h("p", { class: "score" }, "Deck cleared"), h("p", {}, "Every card in this set is marked known."),
        h("div", { class: "actions" },
          h("button", { class: "btn", onclick: () => { for (const k of Object.keys(state.known)) state.known[k] = false; store.set(state); build(false); } }, "Reset progress"),
          h("button", { class: "btn primary", onclick: () => build(false) }, "Study all again"))));
      document.onkeydown = null; return;
    }
    const c = items[queue[0]];
    const flash = h("div", { class: "flash" + (flipped ? " flipped" : ""), role: "button", tabindex: 0, "aria-label": "Flip card", onclick: () => { flipped = !flipped; flash.classList.toggle("flipped", flipped); } },
      h("div", { class: "inner" },
        h("div", { class: "face front" }, tags(c), h("div", { class: "big" }, c.front)),
        h("div", { class: "face back" }, h("div", {}, c.back), cites(c))));
    app.append(flash, h("p", { class: "hint" }, `${queue.length} in queue · Space to flip · ← again · → got it`),
      h("div", { class: "actions" }, h("button", { class: "btn bad", onclick: () => mark(false) }, "Again"), h("button", { class: "btn good", onclick: () => mark(true) }, "Got it")));
    document.onkeydown = e => {
      if (e.key === " ") { e.preventDefault(); flash.click(); }
      else if (e.key === "ArrowLeft") mark(false);
      else if (e.key === "ArrowRight") mark(true);
    };
  }
  build(true);
}

(DATA.type === "flashcards" ? flashcards : quiz)(DATA.items);
</script>
</body>
</html>
